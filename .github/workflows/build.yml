name: Build plugins

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (VST3, 64-bit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: pwsh
        run: |
          function Pack($target, $product, $readme) {
            $out = "$target-Windows"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            $base = "build/$target" + "_artefacts/Release"
            if (-not (Test-Path $base)) { $base = "build/RoomFix/$target" + "_artefacts/Release" }
            Copy-Item -Recurse "$base/VST3/$product.vst3" "$out/"
            Copy-Item "$base/Standalone/$product.exe" "$out/"
            Copy-Item $readme "$out/LEGGIMI.txt"
            Compress-Archive -Path "$out/*" -DestinationPath "$target-Windows.zip"
          }
          Pack "AeroVox2000" "AeroVox 2000" "installer/LEGGIMI-Windows.txt"
          Pack "RoomFix2000" "RoomFix 2000" "installer/LEGGIMI-RoomFix-Windows.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: '*-Windows.zip'

  macos:
    name: macOS (VST3 + AU, Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Ad-hoc sign
        run: |
          for R in build/AeroVox2000_artefacts/Release build/RoomFix/RoomFix2000_artefacts/Release; do
            for f in "$R"/VST3/*.vst3 "$R"/AU/*.component "$R"/Standalone/*.app; do codesign --force --deep -s - "$f"; done
          done

      - name: Validate Audio Units (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/AeroVox2000_artefacts/Release/AU/*.component build/RoomFix/RoomFix2000_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumf Av2k Aerv
          auval -v aufx Rfx2 Aerv

      - name: Package (.zip and .pkg installer)
        run: |
          pack() { # target product readme bundle-id
            R="$1"; [ -d "build/$1_artefacts" ] && R="build/$1_artefacts/Release" || R="build/RoomFix/$1_artefacts/Release"
            OUT="$1-macOS"; ROOT="pkgroot-$1"
            mkdir -p "$OUT" "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components"
            cp -R "$R/VST3/$2.vst3" "$R/AU/$2.component" "$R/Standalone/$2.app" "$OUT/"
            cp "$3" "$OUT/LEGGIMI.txt"
            cp -R "$R/VST3/$2.vst3" "$ROOT/Library/Audio/Plug-Ins/VST3/"
            cp -R "$R/AU/$2.component" "$ROOT/Library/Audio/Plug-Ins/Components/"
            pkgbuild --root "$ROOT" --install-location / --identifier "$4" --version 1.1.0 "$OUT/Installa $2.pkg"
            ditto -c -k --keepParent "$OUT" "$1-macOS.zip"
          }
          pack AeroVox2000 "AeroVox 2000" installer/LEGGIMI-macOS.txt com.aerovoxaudio.aerovox2000.pkg
          pack RoomFix2000 "RoomFix 2000" installer/LEGGIMI-RoomFix-macOS.txt com.aerovoxaudio.roomfix2000.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: '*-macOS.zip'

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: AeroVox 2000 + RoomFix 2000 (v1.1.0)
          make_latest: true
          files: dist/*.zip
          body: |
            ## RoomFix 2000 (nuovo)
            Toglie le risonanze della stanza imparandole da una registrazione dell'ambiente, senza toccare la voce.
            - **Windows**: `RoomFix2000-Windows.zip`
            - **Mac**: `RoomFix2000-macOS.zip` (AU per Logic + VST3 + installer .pkg, Apple Silicon + Intel)

            ## AeroVox 2000
            Vocoder, EQ anti-risonanze automatico, Fresh Air, Reverb.
            - **Windows**: `AeroVox2000-Windows.zip`
            - **Mac**: `AeroVox2000-macOS.zip`

            Istruzioni di installazione nel file LEGGIMI.txt dentro ogni zip.
